name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Upload APK to Firebase App Distribution
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          set -o pipefail
          apk_path=$(find "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release" -name '*.apk' -type f -print -quit)
          npx --yes firebase-tools@latest appdistribution:distribute "$apk_path" \
            --app "$FIREBASE_APP_ID" \
            --testers "$FIREBASE_TESTERS" \
            --release-notes "GitHub Actions build $GITHUB_SHA" | tee firebase-upload.log

      - name: Show downloadable APK link
        shell: bash
        run: |
          apk_path=$(find "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release" -name '*.apk' -type f -print -quit)
          echo "APK path on runner: $apk_path"
          {
            echo "## Release APK"
            echo
            echo "Firebase App Distribution uploaded this build and notified the configured testers."
            echo
            echo "APK path in the build workspace: \`$apk_path\`"
            echo
            echo "Firebase upload details:"
            echo
            sed 's/^/    /' firebase-upload.log
          } >> "$GITHUB_STEP_SUMMARY"
