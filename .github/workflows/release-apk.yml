name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ocr-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Show downloadable APK link
        shell: bash
        run: |
          apk_path=$(find "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release" -name '*.apk' -type f -print -quit)
          artifact_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          echo "APK path on runner: $apk_path"
          echo "Downloadable artifact: $artifact_url"
          {
            echo "## Release APK"
            echo
            echo "[Download the APK artifact]($artifact_url)"
            echo
            echo "APK path in the build workspace: \`$apk_path\`"
          } >> "$GITHUB_STEP_SUMMARY"
